[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evacuation-drill-tracker"
version = "0.1.0"
description = "Evacuation drill log with timing statistics and overdue alerts"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
